<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><title>Select PowerBank | CALON</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html"><span class="brandmark"></span><span>CALON</span></a><div class="mqtt-pill" data-mqtt-pill><span data-mqtt-label>Offline</span><span data-mqtt-dot></span></div></header><main class="app"><div class="app-head"><div class="eyebrow">Rental / Step 03</div><h1>Select your power bank.</h1><p>Choose one of the power banks reported available by the STM32 station.</p></div><section class="card"><div id="mqttStatus" class="status"><span class="status-dot"></span><span>Station availability received ✓</span></div><div id="devices" class="choices" style="margin-top:14px"></div><button id="continue" class="btn btn-gold" disabled style="width:100%;margin-top:16px">Continue to payment →</button><div id="flowError" class="flow-error hidden"></div></section></main></div><script>let selected=null;document.addEventListener('DOMContentLoaded',()=>{const s=getSession();let list=Array.isArray(s.availability)?s.availability:[];const box=document.getElementById('devices');list.forEach(d=>{const deviceId=d.powerbank_id||d.device_id||d.id||d.slot_id;if(!deviceId)return;const b=document.createElement('button');b.type='button';b.className='choice';b.innerHTML='<span><span class="choice-title">'+esc(deviceId)+'</span><span class="choice-sub">Available'+(d.battery!=null?' · '+esc(d.battery)+'% battery':'')+(d.slot_id?' · Slot '+esc(d.slot_id):'')+'</span></span><span class="price">SELECT</span>';b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected={deviceId,battery:d.battery,slotId:d.slot_id};document.getElementById('continue').disabled=false};box.appendChild(b)});if(!box.children.length){showError('No available power bank was saved. Please start the rental again.');return}document.getElementById('continue').onclick=()=>{if(!selected)return;setSession({deviceId:selected.deviceId,battery:selected.battery,slotId:selected.slotId,selectionSent:true});document.getElementById('continue').disabled=true;document.getElementById('continue').textContent='Power bank selected ✓';setTimeout(()=>location.href='payment.html',250)}});</script></body></html>
