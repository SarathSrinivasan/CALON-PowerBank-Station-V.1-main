<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><title>Rental Plan | CALON</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html"><span class="brandmark"></span><span>CALON</span></a><div class="mqtt-pill" data-mqtt-pill><span data-mqtt-label>Offline</span><span data-mqtt-dot></span></div></header><main class="app"><div class="app-head"><div class="eyebrow">Rental / Step 02</div><h1>Choose your plan.</h1><p>Select the rental duration, then press Rent Request. The website sends exactly one RENT_REQUESTED message; plan details stay in the browser and no RENT_PLAN / RENT_PLAN_SELECTED message is published.</p></div><section class="card"><div id="mqttStatus" class="status"><span class="status-dot"></span><span>Connecting to station…</span></div><div class="choices" style="margin-top:14px"><button class="choice" data-hours="1" data-price="50"><span><span class="choice-title">1 hour</span><span class="choice-sub">Quick top-up</span></span><span class="price">₹50</span></button><button class="choice" data-hours="2" data-price="100"><span><span class="choice-title">2 hours</span><span class="choice-sub">Longer journey</span></span><span class="price">₹100</span></button><button class="choice" data-hours="3" data-price="150"><span><span class="choice-title">3 hours</span><span class="choice-sub">Maximum flexibility</span></span><span class="price">₹150</span></button></div><button class="btn btn-gold" id="planBtn" disabled style="width:100%;margin-top:16px">Rent request & check availability →</button><div id="flowError" class="flow-error hidden"></div></section><section class="card"><div class="rows"><div class="row"><span class="label">Request</span><span class="value" data-session-id>—</span></div><div class="row"><span class="label">Customer</span><span class="value" data-customer-id>—</span></div></div></section></main></div><script>let selected=null;document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected={hours:+b.dataset.hours,price:+b.dataset.price};document.getElementById('planBtn').disabled=false});document.getElementById('planBtn').onclick=()=>{if(!selected)return;setSession({...selected,requestSent:false,availabilityReceived:false});document.getElementById('planBtn').disabled=true;document.getElementById('planBtn').textContent='Sending rent request…';status('Plan saved. Opening station request…','warn');setTimeout(()=>location.href='availability.html',150)}});</script></body></html>
